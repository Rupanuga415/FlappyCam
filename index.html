<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FlappyCam | Play Flappy Bird Using Your Camera</title>

        <script src="./main.js" defer></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"
            defer
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"
            defer
        ></script>
        <script src="./backend.js" defer></script>

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300;1,300&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="./stylesheet.css" />
    </head>
    <body>
        <header>
            <h1>FlappyCAM&nbsp;<i class="bi bi-camera"></i></h1>

            <h4>Play Flappy Bird Using Your Camera</h4>
        </header>

        <main>
            <div id="DivBlack-bg">
                <canvas id="gameCanvas" width="400 " height="640"></canvas>
            </div>

            <details id="DivYour-cam" open>
                <summary>
                    <h3>
                        Your Camera&nbsp;
                        <svg
                            xmlns="http://w3.org"
                            viewBox="0 0 24 24"
                            width="20"
                            height="20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M4 9l8 8 8-8" />
                        </svg>
                    </h3>
                </summary>

                <div class="camera-row">
                    <div id="webcam-container"></div>
                    <div id="label-container"></div>
                </div>
            </details>
        </main>
        <script>
            window.addEventListener("load", () => {
                init();
            });
        </script>
    </body>
</html>
